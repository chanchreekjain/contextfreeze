<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ContextFreeze</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img class="mark" src="icons/mark.svg" alt="" width="16" height="16">
        <h1>ContextFreeze</h1>
      </div>
      <button id="freeze" class="primary" type="button">Freeze this window</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>

    <main>
      <section id="here" hidden>
        <h2 class="section">This page</h2>
        <div class="mark-row">
          <button id="mark-spot" class="ghost" type="button">Mark this spot</button>
          <button id="mark-moment" class="ghost" type="button">Flag this moment</button>
        </div>
        <ul id="checkpoints" class="list"></ul>
        <p id="no-checkpoints" class="empty">
          Mark a spot and this page will also start remembering where you left off.
        </p>
      </section>

      <h2 class="section">Saved windows</h2>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>
        Nothing frozen yet. Hit the button above and ContextFreeze will remember
        where you were in every tab of this window.
      </p>
      <footer class="footer">
        <button id="copy" class="link" type="button">Copy</button>
        <button id="save-md" class="link" type="button">Save .md</button>
        <button id="save-json" class="link" type="button">Save .json</button>
        <button id="import" class="link" type="button">Import</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </footer>
    </main>

    <template id="checkpoint-template">
      <li class="row checkpoint">
        <span class="badge" aria-hidden="true"></span>
        <div class="row-main">
          <button class="name" type="button" title="Click to rename"></button>
          <p class="meta"></p>
        </div>
        <div class="row-actions">
          <button class="jump" type="button">Jump</button>
          <button class="delete" type="button" aria-label="Delete">&times;</button>
        </div>
      </li>
    </template>

    <template id="row-template">
      <li class="row">
        <div class="row-main">
          <button class="name" type="button" title="Click to rename"></button>
          <p class="meta"></p>
        </div>
        <div class="row-actions">
          <button class="restore" type="button" title="Restore in a new window">Restore</button>
          <button class="delete" type="button" title="Delete" aria-label="Delete">&times;</button>
        </div>
      </li>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
